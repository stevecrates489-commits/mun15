[package]
name = "minidisc-player"
version = "0.1.0"
description = "MUN15H MiniDisc Player"
edition = "2021"
authors = ["aryan"]

[lib]
name = "minidisc_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The online sources. The registry needs an HTTP client to talk to the
# providers, and a tiny local server so the player can be handed bytes
# without ever being handed a remote address.
#
# reqwest uses rustls rather than the system OpenSSL: on Windows the system
# one is often missing, and a build that depends on it is a build that
# fails on someone else's machine.
reqwest = { version = "0.13", default-features = false, features = [
  "stream",
  "rustls",
  "webpki-roots",
  "charset",
  "http2",
  "json",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "fs",
  "process",
] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
http = "1"
thiserror = "1"
url = "2"
async-trait = "0.1"
getrandom = "0.4"
# the YouTube sign-in: a DevTools Protocol websocket for asking the browser
# about its own cookies, and a hash for the request signature.
tokio-tungstenite = "0.30"
sha1 = "0.11"
sha2 = "0.11"

# The visualiser. The engine is the real MilkDrop renderer, and it is a Rust
# crate that draws through wgpu — so the host has to be a wgpu host, with a
# device of its own and a surface of its own.
#
# wgpu is pinned to the same major as the engine's own dependency, so the
# two resolve to ONE crate instance: the engine's config takes a
# `wgpu::TextureFormat`, and that has to be the same type as ours.
lactea = "0.2.2"
wgpu = { version = "30.0.1", default-features = false, features = [
  "std",
  "parking_lot",
  "wgsl",
  "dx12",
  "vulkan",
] }
# the adapter and the device are wanted before the first frame, so the
# futures are blocked on rather than awaited
pollster = "1"
# the pictures a preset asks for by name
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# the visualiser's own window: borderless, always on top, no focus
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

# smallest possible binary: one codegen unit, full LTO, size-oriented opt, no panic unwind
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
incremental = false

# The dev build is where every rebuild happens, and the LINK is its slowest
# part: the full debug-info payload for a binary this size (tauri + wgpu +
# lactea) is measured in gigabytes, and writing it is what the minutes go
# on. Line tables alone still name the file and line of a panic, which is
# all the Rust side of this app is ever asked for.
[profile.dev]
debug = 1
incremental = true
